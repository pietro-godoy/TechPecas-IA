<style>
.pd-card{background:white;border:1px solid #ddd;border-radius:18px;padding:clamp(18px,4vw,36px);margin:18px 0;color:#171717}.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.pd-media{background:#f5f4f1;border-radius:12px;min-height:300px;display:grid;place-items:center;overflow:hidden}.pd-media img{width:100%;height:360px;object-fit:contain}.pd-price{font-size:36px;font-weight:800;margin:20px 0 8px}.pd-actions{display:grid;gap:12px;margin-top:20px}.pd-spec{width:100%;border-collapse:collapse}.pd-spec th,.pd-spec td{text-align:left;padding:13px;border-bottom:1px solid #eee;overflow-wrap:anywhere}.pd-spec th{width:35%;background:#f6f6f6}.pd-stars{font-size:28px;color:#999}.pd-card h2{margin-bottom:16px}.pd-card p{line-height:1.6}.pd-note{color:#666;font-size:14px}@media(max-width:700px){.pd-grid{grid-template-columns:1fr}.pd-media img{height:250px}}

.store-page>p>a,.pd-card a:not(.secondary-cta){color:#c91e30;text-decoration:none;font-weight:700}.store-page>p>a{display:inline-flex;background:white;border:1px solid #ddd;border-radius:24px;padding:10px 18px}.pd-card{box-shadow:0 5px 20px #00000008}.pd-card h1{font-size:clamp(24px,3vw,38px);line-height:1.15;margin:12px 0}.pd-card h2{font-size:24px;letter-spacing:-.5px}.pd-card label{display:block;font-weight:700;margin:12px 0}.pd-card select,.pd-card textarea,.pd-card input{display:block;width:100%;box-sizing:border-box;border:1px solid #d8d8d8;border-radius:12px;background:#faf9f7;padding:13px;font:inherit;color:#171717;margin-top:8px}.pd-card textarea{resize:vertical}.pd-card select:focus,.pd-card textarea:focus,.pd-card input:focus{outline:2px solid #e62435;outline-offset:2px}.pd-card .primary-cta{justify-content:center}.pd-vehicle-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.pd-verdict{padding:16px;border-radius:12px;background:#f5f4f1;margin:16px 0;line-height:1.5}.pd-verdict[data-state="yes"]{background:#eaf5ed;color:#17653a}.pd-verdict[data-state="unknown"]{background:#fff5e4;color:#79500b}.pd-stars{color:#e62435}.pd-review-item{border-top:1px solid #eee;padding:12px 0}.pd-spec tr:nth-child(even) td{background:#fafafa}@media(max-width:700px){.pd-vehicle-grid{grid-template-columns:1fr}}

.pd-market{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}.pd-main{min-width:0}.pd-sidebar{display:grid;gap:16px;min-width:0}.pd-sidebar .pd-card{margin:0;padding:20px}.pd-sidebar .pd-buy{position:sticky;top:18px;z-index:1}.pd-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.pd-main>.pd-card:first-child{margin-top:0}.pd-media{min-height:260px;cursor:zoom-in}.pd-media img{height:320px}.pd-thumb{width:62px;height:62px;object-fit:contain;border:1px solid #c91e30;border-radius:8px;background:white;display:block;margin-top:12px}.pd-eyebrow{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:1px;font-weight:800}.pd-market .pd-price{font-size:clamp(30px,4vw,40px);line-height:1.1}.pd-buy .pd-price{font-size:32px}.pd-stock{font-weight:700;color:#19613a}.pd-spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pd-spec-grid h3{font-size:16px;margin:0 0 12px}.pd-spec{border-collapse:separate;border-spacing:0;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;font-size:14px}.pd-spec th,.pd-spec td{padding:12px;border:0;background:#fff}.pd-spec th{width:43%;font-weight:650}.pd-spec tr:nth-child(odd)>*{background:#f2f2f2}.pd-spec tr:nth-child(even)>*{background:#fff}.pd-spec small{display:block;color:#686868;font-size:11px}.pd-related{display:grid;gap:15px}.pd-related a{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;color:#171717!important;font-weight:600!important}.pd-related img,.pd-related-placeholder{width:68px;height:68px;object-fit:contain;background:#f4f4f4;border:1px solid #eee;border-radius:8px;display:grid;place-items:center}.pd-related strong{display:block;color:#171717;margin-top:5px}.pd-payment-methods{display:flex;gap:9px;flex-wrap:wrap}.pd-payment-methods span{background:#f5f5f5;border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-weight:700}.pd-review-summary{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;margin:16px 0}.pd-review-average{font-size:36px;color:#c91e30;font-weight:800}.pd-review-bar{display:grid;grid-template-columns:22px 1fr 24px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.pd-review-track{height:7px;background:#eee;border-radius:8px;overflow:hidden}.pd-review-track span{display:block;background:#c91e30;height:100%}.pd-question-form{display:flex;align-items:end;gap:12px}.pd-question-form label{flex:1;margin:0}.pd-question-form button{white-space:nowrap}.pd-question-answer{margin-top:15px}.pd-zoom{max-width:90vw;max-height:90vh;border:0;border-radius:14px;padding:16px;background:white}.pd-zoom::backdrop{background:#000a}.pd-zoom img{max-width:80vw;max-height:75vh;object-fit:contain;display:block}.pd-zoom button{display:block;margin-left:auto;margin-bottom:8px}.pd-market .pd-card h2{font-size:21px}.pd-market .pd-card h1{font-size:clamp(22px,2.5vw,32px)}.pd-main .pd-card{padding:clamp(16px,2.5vw,28px)}@media(max-width:1000px){.pd-market{grid-template-columns:minmax(0,1fr) 280px}.pd-grid,.pd-spec-grid{grid-template-columns:1fr}}@media(max-width:760px){.pd-market{display:flex;flex-direction:column}.pd-main,.pd-sidebar{width:100%}.pd-sidebar{order:0}.pd-sidebar .pd-buy{position:static}.pd-review-summary{grid-template-columns:1fr}.pd-question-form{display:grid}}
@media(max-width:760px){.pd-market{display:grid;grid-template-columns:minmax(0,1fr)}.pd-main,.pd-sidebar{display:contents}.pd-main>.pd-card:first-child{order:0}.pd-sidebar .pd-buy{order:1}.pd-main>.pd-card:not(:first-child){order:2;margin:0}.pd-sidebar>.pd-card:not(.pd-buy){order:3}.pd-media img{height:260px}}
